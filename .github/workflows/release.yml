name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-14
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - if: ${{ !contains(matrix.target, 'musl') && !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - if: contains(matrix.target, 'musl')
        run: |
          file "target/${{ matrix.target }}/release/grfsh" | grep -qE 'static(ally|-pie) linked'
          "target/${{ matrix.target }}/release/grfsh" -c 'echo $((6 * 7))' | grep -qx 42

      - name: Package
        shell: bash
        run: |
          name="grfsh-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/grfsh" README.md LICENSE docs/grfsh.1 "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: grfsh-*.tar.gz*

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo install cargo-deb cargo-generate-rpm

      - run: cargo build --release

      - name: Build .deb and .rpm
        run: |
          cargo deb --no-build --output "grfsh_${GITHUB_REF_NAME#v}_amd64.deb"
          cargo generate-rpm --output "grfsh-${GITHUB_REF_NAME#v}.x86_64.rpm"
          for file in *.deb *.rpm; do shasum -a 256 "$file" > "$file.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            *.deb*
            *.rpm*

  release:
    needs: [build, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: sigstore/cosign-installer@v3

      - name: Checksums and signatures
        run: |
          cat *.sha256 | sed 's/  .*\//  /' > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" grfsh-*.tar.gz* *.deb* *.rpm* SHA256SUMS SHA256SUMS.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --title "grfsh $GITHUB_REF_NAME" --generate-notes
