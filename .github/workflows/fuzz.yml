name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, words, pattern, arithmetic, data]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - run: cargo install cargo-fuzz

      - name: Fuzz ${{ matrix.target }} for ten minutes
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600 -max_len=1024

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts

  run-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - run: cargo install cargo-fuzz

      - name: Run untrusted scripts in the sandbox for two minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/run artifacts
          cp ../tests/compat/*.sh corpus/run/
          cargo fuzz run -s none run "$PWD/corpus/run" -- -max_total_time=120 -max_len=2048 -timeout=10 -rss_limit_mb=2048 -close_fd_mask=3 -artifact_prefix="$PWD/artifacts/"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-run-smoke
          path: fuzz/artifacts
