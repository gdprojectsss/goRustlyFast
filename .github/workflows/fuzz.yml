name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, words, pattern, arithmetic, data]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - run: cargo install cargo-fuzz

      - name: Fuzz ${{ matrix.target }} for ten minutes
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600 -max_len=1024

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts
