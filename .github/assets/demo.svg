  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="440.0" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">grfsh</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="22" y="58" xml:space="preserve"><tspan fill="#7ee787">you@laptop</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#79c0ff">~/servers</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">(main)</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#7ee787">load</tspan><tspan fill="#e6edf3"> servers.csv</tspan><tspan fill="#56d4dd"> |</tspan><tspan fill="#7ee787"> where</tspan><tspan fill="#e6edf3"> cpu</tspan><tspan fill="#e6edf3"> -gt</tspan><tspan fill="#e6edf3"> 50</tspan><tspan fill="#56d4dd"> |</tspan><tspan fill="#7ee787"> sort-by</tspan><tspan fill="#e6edf3"> cpu</tspan><tspan fill="#e6edf3"> -r</tspan></text>
    <text x="22" y="80" xml:space="preserve"><tspan fill="#e6edf3">host   region  cpu  uptime_days</tspan></text>
    <text x="22" y="102" xml:space="preserve"><tspan fill="#8b949e">-----  ------  ---  -----------</tspan></text>
    <text x="22" y="124" xml:space="preserve"><tspan fill="#e6edf3">db-1   us       91          203</tspan></text>
    <text x="22" y="146" xml:space="preserve"><tspan fill="#e6edf3">web-1  eu       72           41</tspan></text>
    <text x="22" y="168" xml:space="preserve"><tspan fill="#7ee787">you@laptop</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#79c0ff">~/servers</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">(main)</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#7ee787">files</tspan><tspan fill="#e6edf3"> src</tspan><tspan fill="#56d4dd"> |</tspan><tspan fill="#7ee787"> where</tspan><tspan fill="#e6edf3"> type</tspan><tspan fill="#e6edf3"> ==</tspan><tspan fill="#e6edf3"> dir</tspan><tspan fill="#56d4dd"> |</tspan><tspan fill="#7ee787"> count</tspan></text>
    <text x="22" y="190" xml:space="preserve"><tspan fill="#e6edf3">6</tspan></text>
    <text x="22" y="212" xml:space="preserve"><tspan fill="#7ee787">you@laptop</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#79c0ff">~/servers</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">(main)</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#7ee787">gti</tspan><tspan fill="#e6edf3"> status</tspan></text>
    <text x="22" y="234" xml:space="preserve"><tspan fill="#ff7b72">grfsh:</tspan><tspan fill="#e6edf3"> gti: command not found, did you mean 'git'?</tspan></text>
    <text x="22" y="256" xml:space="preserve"><tspan fill="#7ee787">you@laptop</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#79c0ff">~/servers</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">(main)</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">[127]</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#7ee787">sleep</tspan><tspan fill="#e6edf3"> 30</tspan><tspan fill="#56d4dd"> &amp;</tspan></text>
    <text x="22" y="278" xml:space="preserve"><tspan fill="#e6edf3">[1] 16314</tspan></text>
    <text x="22" y="300" xml:space="preserve"><tspan fill="#7ee787">you@laptop</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#79c0ff">~/servers</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">(main)</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">jobs:1</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#7ee787">jobs</tspan></text>
    <text x="22" y="322" xml:space="preserve"><tspan fill="#e6edf3">[1]+  Running    sleep 30</tspan></text>
    <text x="22" y="344" xml:space="preserve"><tspan fill="#7ee787">you@laptop</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#79c0ff">~/servers</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">(main)</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">jobs:1</tspan><tspan fill="#e6edf3"> $ </tspan></text>
    <rect x="333.9" y="331" width="8" height="17" fill="#e6edf3">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
